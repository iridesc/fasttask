services:
  fasttask:
    image: docker.io/irid/fasttask:desktop-test
    container_name: fasttask-desktop
    restart: always

    security_opt:
      - seccomp:unconfined

    ports:
      # 在single_node 与 distributed_master 需要映射api端口
      - "9001:443"
      # 对象存储端口：预签名下载地址指向这里，客户端需要能访问到
      - "9000:9000"
      
      # webtop  related
      - 3000:3001

    volumes:
      - ./files:/fasttask/files

    environment:
      # single_node: 单一节点提供接口+执行任务
      - NODE_TYPE=single_node
      # 结果存储：超过阈值的结果外置到内嵌对象存储
      - RESULT_TYPE=AUTO
      # 预签名下载地址的对外地址（必须是客户端可达的地址）
      - S3_PUBLIC_ENDPOINT=127.0.0.1:9000

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop
      - PASSWORD=webtop_passwd
      - FLOWER_ENABLED=True
