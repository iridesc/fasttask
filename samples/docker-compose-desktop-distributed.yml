services:
  fasttask-desktop-master:
    image: docker.io/irid/fasttask:desktop-test
    container_name: fasttask-desktop-master
    restart: always

    # 优雅停机等待时间，必须大于容器内 supervisord 各程序 stopwaitsecs 之和
    # （celery 8s + redis 10s ≈ 18s），取 60s 留足冗余。docker 默认只有 10s，
    # 会 SIGKILL 掉容器导致队列数据丢失（详见 readme「Redis 持久化与迁移」）。
    stop_grace_period: 60s

    security_opt:
      - seccomp:unconfined

    ports:
      # 在single_node 与 distributed_master 需要映射api端口 
      - "9001:443"
      # 在distributed_master需要映射任务队列端口（仅绑本机；跨主机部署去掉 127.0.0.1 并把口令改成强口令）
      - "127.0.0.1:9000:6379"
      # webtop  related
      - 3000:3001

    volumes:
       - ./files:/fasttask/files

    environment:
      - NODE_TYPE=distributed_master
      - TASK_QUEUE_PASSWD=passwd
      # 结果存储：超过阈值的结果外置到内嵌对象存储
      - RESULT_TYPE=AUTO

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop
      - PASSWORD=webtop_passwd
      - FLOWER_ENABLED=True

  fasttask-desktop-worker-get_circle_area:
    image: docker.io/irid/fasttask:desktop-test
    container_name: fasttask-desktop-worker-get_circle_area
    restart: always

    # 优雅停机等待时间，取 60s 留足冗余。
    stop_grace_period: 60s

    # 保证停止时 worker 先于 master：worker 停止时要把未确认的任务 requeue 回
    # master 的队列，此时 master 的 redis 必须还活着。
    depends_on:
      - fasttask-desktop-master

    security_opt:
      - seccomp:unconfined

    ports:
      # webtop  related
      - 3001:3001

    volumes:
      - ./files-worker_1:/fasttask/files

 
    environment:
      - NODE_TYPE=distributed_worker
      - MASTER_HOST=fasttask-desktop-master
      - TASK_QUEUE_PORT=6379
      - TASK_QUEUE_PASSWD=passwd
      - RESULT_TYPE=AUTO
      - ENABLED_TASKS=get_circle_area
      - FLOWER_ENABLED=True

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop-worker
      - PASSWORD=passwd

  fasttask-desktop-worker-get_hypotenuse:
    image: docker.io/irid/fasttask:desktop-test
    container_name: fasttask-desktop-worker-get_hypotenuse
    restart: always

    # 优雅停机等待时间，取 60s 留足冗余。
    stop_grace_period: 60s

    # 同上：保证停止时 worker 先于 master。
    depends_on:
      - fasttask-desktop-master

    security_opt:
      - seccomp:unconfined

    ports:
      # webtop  related
      - 3002:3001

    volumes:
      - ./files-worker_2:/fasttask/files

    environment:
      - NODE_TYPE=distributed_worker
      - MASTER_HOST=fasttask-desktop-master
      - TASK_QUEUE_PORT=6379
      - TASK_QUEUE_PASSWD=passwd
      - RESULT_TYPE=AUTO
      - FLOWER_ENABLED=True
      - DISABLED_TASKS=get_circle_area

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop-worker
      - PASSWORD=passwd
    