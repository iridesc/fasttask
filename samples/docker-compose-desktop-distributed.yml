services:
  fasttask-desktop-master:
    image: docker.io/irid/fasttask:desktop-test
    container_name: fasttask-desktop-master
    restart: always

    security_opt:
      - seccomp:unconfined

    ports:
      # 在single_node 与 distributed_master 需要映射api端口 
      - "9001:443"
      # 在distributed_master需要映射任务队列端口
      - "9000:6379"
      # 对象存储端口：预签名下载地址指向这里，客户端需要能访问到
      - "9100:9000"
      # webtop  related
      - 3000:3001

    volumes:
       - ./files:/fasttask/files

    environment:
      - NODE_TYPE=distributed_master
      - TASK_QUEUE_PASSWD=passwd
      # 结果存储：超过阈值的结果外置到内嵌对象存储
      - RESULT_TYPE=AUTO
      # 预签名下载地址的对外地址（必须是客户端可达的地址）
      - S3_PUBLIC_ENDPOINT=127.0.0.1:9100

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop
      - PASSWORD=webtop_passwd
      - FLOWER_ENABLED=True

  fasttask-desktop-worker-get_circle_area:
    image: docker.io/irid/fasttask:desktop-test
    container_name: fasttask-desktop-worker-get_circle_area
    restart: always

    security_opt:
      - seccomp:unconfined

    ports:
      # webtop  related
      - 3001:3001

    volumes:
      - ./files-worker_1:/fasttask/files

 
    environment:
      - NODE_TYPE=distributed_worker
      - MASTER_HOST=fasttask-desktop-master
      - TASK_QUEUE_PORT=6379
      - TASK_QUEUE_PASSWD=passwd
      - RESULT_TYPE=AUTO
      - ENABLED_TASKS=get_circle_area
      - FLOWER_ENABLED=True

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop-worker
      - PASSWORD=passwd

  fasttask-desktop-worker-get_hypotenuse:
    image: docker.io/irid/fasttask:desktop-test
    container_name: fasttask-desktop-worker-get_hypotenuse
    restart: always


    security_opt:
      - seccomp:unconfined

    ports:
      # webtop  related
      - 3002:3001

    volumes:
      - ./files-worker_2:/fasttask/files

    environment:
      - NODE_TYPE=distributed_worker
      - MASTER_HOST=fasttask-desktop-master
      - TASK_QUEUE_PORT=6379
      - TASK_QUEUE_PASSWD=passwd
      - RESULT_TYPE=AUTO
      - FLOWER_ENABLED=True
      - DISABLED_TASKS=get_circle_area

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop-worker
      - PASSWORD=passwd
    