services:
  fasttask-desktop-master:
    image: irid/fasttask:desktop-test
    container_name: fasttask-desktop-master
    restart: always

    # 优雅停机等待时间，必须大于容器内 supervisord 各程序 stopwaitsecs 之和
    # （celery 8s + redis 10s ≈ 18s），取 60s 留足冗余。docker 默认只有 10s，
    # 会 SIGKILL 掉容器导致队列数据丢失（详见 readme「Redis 持久化与迁移」）。
    stop_grace_period: 60s

    security_opt:
      - seccomp:unconfined

    ports:
      # 在single_node 与 distributed_master 需要映射api端口 
      - "9001:443"
      # 在distributed_master需要映射任务队列端口（仅绑本机；跨主机部署去掉 127.0.0.1 并把口令改成强口令）
      - "127.0.0.1:9000:6379"
      # webtop  related
      - 3000:3001

    volumes:
       - ./files:/fasttask/files

    environment:
      - NODE_TYPE=distributed_master
      - TASK_QUEUE_PASSWD=passwd
      # 结果存储：超过阈值的结果外置到内嵌对象存储
      - RESULT_TYPE=AUTO

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop
      - PASSWORD=webtop_passwd


  fasttask-desktop-worker-get_circle_area:
    image: irid/fasttask:desktop-test
    container_name: fasttask-desktop-worker-get_circle_area
    restart: always

    # 优雅停机等待时间，取 60s 留足冗余。
    stop_grace_period: 60s

    # 保证停止时 worker 先于 master：worker 停止时要把未确认的任务 requeue 回
    # master 的队列，此时 master 的 redis 必须还活着。
    depends_on:
      - fasttask-desktop-master

    security_opt:
      - seccomp:unconfined

    ports:
      # webtop  related
      - 3001:3001

    volumes:
      - ./files-worker_1:/fasttask/files

 
    environment:
      - NODE_TYPE=distributed_worker
      - MASTER_HOST=fasttask-desktop-master
      - TASK_QUEUE_PORT=9000
      - TASK_QUEUE_PASSWD=passwd
      - RESULT_TYPE=AUTO

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop-worker
      - PASSWORD=passwd

  fasttask-desktop-worker-get_hypotenuse:
    image: irid/fasttask:desktop-test
    container_name: fasttask-desktop-worker-get_hypotenuse
    restart: always

    # 优雅停机等待时间，取 60s 留足冗余。
    stop_grace_period: 60s

    # 同上：保证停止时 worker 先于 master。
    depends_on:
      - fasttask-desktop-master

    security_opt:
      - seccomp:unconfined

    ports:
      # webtop  related
      - 3002:3001

    volumes:
      - ./files-worker_2:/fasttask/files

    environment:
      - NODE_TYPE=distributed_worker
      - MASTER_HOST=fasttask-desktop-master
      - TASK_QUEUE_PORT=9000
      - TASK_QUEUE_PASSWD=passwd
      - RESULT_TYPE=AUTO

      # webtop  related
      - PUID=1000
      - PGID=1000
      - TITLE=fasttask-desktop-worker
      - PASSWORD=passwd

  vsftpd:
    image: fauria/vsftpd:latest
    container_name: vsftpd
    restart: unless-stopped
    ports:
      - "21:21"                     # 控制连接
      - "21100-21110:21100-21110"   # 被动模式端口段（按需扩大）
    environment:
      - FTP_USER=demo               # 登录用户名（示例）
      - FTP_PASS=demo123            # 登录密码（示例）
      - PASV_ENABLE=YES
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
      - PASV_ADDRESS=your.public.ip.or.hostname  # 改成你的公网IP或域名
      - LOG_STDOUT=YES              # 日志输出到 docker logs
    volumes:
      - ./files:/home/vsftpd        # 挂载的数据目录（容器内各用户家目录）
      - ./logs:/var/log/vsftpd     # 挂载日志目录
  