services:
  master:
    image: docker.io/irid/fasttask:test
    container_name: fasttask-master
    restart: always

    # 优雅停机等待时间，必须大于容器内 supervisord 各程序 stopwaitsecs 之和
    # （celery 8s + redis 10s ≈ 18s），取 60s 留足冗余。docker 默认只有 10s，
    # 会 SIGKILL 掉容器导致队列数据丢失（详见 readme「Redis 持久化与迁移」）。
    stop_grace_period: 60s

    ports:
      - "9001:443"
      # 任务队列端口仅绑本机：同 compose 内的 worker 走容器网络（master:6379）即可，
      # 只有宿主机上手工连 Redis 时才需要这个映射。
      # 跨主机部署需去掉 127.0.0.1 绑定并同时把 TASK_QUEUE_PASSWD 改成强口令。
      - "127.0.0.1:9000:6379"

    volumes:
      - ./files:/fasttask/files

    environment:
      - NODE_TYPE=distributed_master
      - TASK_QUEUE_PASSWD=passwd
      - FLOWER_ENABLED=True
      # 结果存储：超过阈值的结果外置到 master 容器内嵌的对象存储
      # （worker 上传、master 签发预签名下载地址，凭据由 TASK_QUEUE_PASSWD 派生）
      - RESULT_TYPE=AUTO

  worker-get_circle_area:
    image: docker.io/irid/fasttask:test
    container_name: fasttask-worker-get_circle_area
    restart: always

    # 优雅停机等待时间，必须大于容器内 supervisord 各程序 stopwaitsecs 之和
    # （celery 8s ≈ 8s），取 60s 留足冗余。
    stop_grace_period: 60s

    # depends_on 只影响启动顺序（master 先起），但 compose 停止时按依赖**逆序**：
    # worker 先停、master 后停。这正是 requeue 需要的顺序 —— worker 停止时要把未确认的
    # 任务放回 master 的队列，此时 master 的 redis 必须还活着。
    depends_on:
      - master

    volumes:
      - ./files-worker_1:/fasttask/files

    environment:
      - NODE_TYPE=distributed_worker
      - MASTER_HOST=master
      - TASK_QUEUE_PORT=6379
      - TASK_QUEUE_PASSWD=passwd
      - ENABLED_TASKS=get_circle_area
      - WORKER_TAG=get_circle_area
      - FLOWER_ENABLED=True
      - RESULT_TYPE=AUTO
        

  worker-get_hypotenuse:
    image: docker.io/irid/fasttask:test
    container_name: fasttask-worker-get_hypotenuse
    restart: always

    # 优雅停机等待时间，必须大于容器内 supervisord 各程序 stopwaitsecs 之和
    # （celery 8s ≈ 8s），取 60s 留足冗余。
    stop_grace_period: 60s

    # 同上：保证停止时 worker 先于 master，requeue 时 master 的 redis 还活着。
    depends_on:
      - master

    volumes:
      - ./files-worker_2:/fasttask/files

    environment:

      - NODE_TYPE=distributed_worker
      - MASTER_HOST=master
      - TASK_QUEUE_PORT=6379
      - TASK_QUEUE_PASSWD=passwd
      - DISABLED_TASKS=get_circle_area
      - WORKER_TAG=get_hypotenuse
      - FLOWER_ENABLED=True
      - RESULT_TYPE=AUTO
