[program:redis]
; 持久化用 AOF，不用 RDB：
;   --appendonly yes            以追加日志持久化，每次写操作都记进 AOF
;   --appendfsync everysec       每秒 fsync 一次；崩溃最多丢 1 秒写入
;   --save ""                    清空所有 RDB 自动快照规则
;
; 最后一条是关键，不能省。Redis 收到 SIGTERM 时的关闭顺序是「先 fsync AOF，再同步写一份
; RDB 快照」；只要 save 规则还在，这步就会阻塞（实测 203MB 数据集要 43 秒），而容器停止
; 超时（docker/podman 默认 10s）远小于它，进程会被 SIGKILL 截断，RDB 写不完整 →
; 重启后这期间的队列变更全部丢失。关掉 save 规则后，关机只剩一次 AOF fsync，实测 0.6 秒。
;
; 关掉 RDB 不影响备份能力：Redis 7+ 的 AOF 本身就是 base.rdb（RDB 格式）+ incr.aof 的
; 混合结构，base 部分本身就是一份 RDB 快照。实测磁盘占用与纯 RDB 模式持平（不会翻倍）。
;
; 重要：开启 AOF 后 Redis 启动时**只读 AOF，不再读 dump.rdb**。从 RDB 模式升级过来时，
; 必须先在运行中的实例上执行 `CONFIG SET appendonly yes` 并等后台 rewrite 完成
; （aof_last_bgrewrite_status:ok），否则第一次重启会读到一个空的 AOF，队列数据全丢。
; 操作步骤见 readme「Redis 持久化与迁移」一节。
;
; --dir 指向 REDIS_DIR（在 files 卷内），AOF 文件与 dump.rdb 同目录，重建容器不丢数据。
command=redis-server --bind %(ENV_MASTER_HOST)s --requirepass %(ENV_TASK_QUEUE_PASSWD)s --port %(ENV_TASK_QUEUE_PORT)s --dir %(ENV_REDIS_DIR)s --timeout 0 --appendonly yes --appendfsync everysec --save ""
directory=%(ENV_FASTTASK_DIR)s
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
startsecs=5
; priority=100：supervisord 按 priority 降序停止（数值大的先停）。celery 的 priority 是
; 999（见 celery.conf），所以 celery 先停 —— 它要在这个窗口里把未确认的任务 requeue 回
; 队列，而此时 redis 还活着，requeue 才能写进 AOF。顺序反了 requeue 就会失败。
priority=100
; Redis 正常关闭只需一次 AOF fsync（实测 0.6s），10 秒足够。supervisord 到点会 SIGKILL，
; 所以这个值必须小于 compose 里的 stop_grace_period，否则会打断 redis 的收尾。
stopsignal=TERM
stopwaitsecs=10
