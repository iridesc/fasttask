[program:celery]
command=celery -A celery_app worker --without-gossip --without-mingle -n %(ENV_WORKER_TAG)s@%%h
directory=%(ENV_FASTTASK_DIR)s
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
startsecs=5
; 优雅关机时走 Celery 冷关机：中止运行中的任务，并把未确认的消息放回队列
; （Celery 的 SIGQUIT 处理链会 requeue，SIGTERM 的 warm shutdown 只会干等任务跑完）。
; stopwaitsecs 必须留在容器停止超时（docker/podman 默认 10s）之内，否则 supervisord
; 来不及兜底，redis 也没时间优雅退出，requeue 会让位给外层 SIGKILL。
; 另：requeue 真正生效还依赖 billiard 留在 4.2.x（4.3.0 会把消息 ack 丢弃），见 requirements.txt。
stopsignal=QUIT
stopwaitsecs=8
